<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fefe Games</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #14110f; --card: #211c18; --ink: #fff8ec; --muted: #b9ad9d; --gold: #f2b134; }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 40px 16px; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 32px; } p { color: var(--muted); margin: 8px 0 28px; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    a.game { display: block; background: var(--card); border-radius: 16px; overflow: hidden; color: inherit; text-decoration: none; transition: transform .15s ease; }
    a.game:hover { transform: translateY(-2px); }
    a.game img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
    a.game div { padding: 14px 16px; } a.game b { font-size: 18px; } a.game span { display: block; color: var(--muted); font-size: 14px; margin-top: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Fefe Games</h1>
    <p>Two games made for the Fefe app store by LetiArts. Play them here, or in the Fefe app and launcher to put your score on the leaderboard.</p>
    <div class="grid">
      <a class="game" href="adinkra-match/"><img src="art/adinkra-banner.png" alt="Adinkra Match banner" /><div><b>Adinkra Match</b><span>React · memory game</span></div></a>
      <a class="game" href="ananse-hop/"><img src="art/ananse-banner.png" alt="Ananse Hop banner" /><div><b>Ananse Hop</b><span>HTML5 canvas · endless runner</span></div></a>
    </div>
  </main>
</body>
</html>
